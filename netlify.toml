# Netlify configuration for vente.club

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"

# Sitemap dynamique via edge function
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/generate-sitemap"
  status = 200
  force = true

# Force HTTPS redirect
[[redirects]]
  from = "http://vente.club/*"
  to = "https://vente.club/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.vente.club/*"
  to = "https://vente.club/:splat"
  status = 301
  force = true

# Redirect www to non-www (HTTPS)
[[redirects]]
  from = "https://www.vente.club/*"
  to = "https://vente.club/:splat"
  status = 301
  force = true

# Static file redirects (must come before SPA fallback)
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# Sitemap is handled by edge function redirect above

[[redirects]]
  from = "/manifest.webmanifest"
  to = "/manifest.webmanifest"
  status = 200

[[redirects]]
  from = "/favicon-vente.png"
  to = "/favicon-vente.png"
  status = 200

[[redirects]]
  from = "/logo.png"
  to = "/logo.png"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# SPA fallback - ALL other routes go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Cache headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# No cache for index.html to force fresh content
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
