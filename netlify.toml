# Netlify configuration for vente.club

[build]
  publish = "dist"
  command = "npm run build"

# Sitemap dynamique via edge function
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/generate-sitemap"
  status = 200
  force = true

# Force HTTPS redirect
[[redirects]]
  from = "http://vente.club/*"
  to = "https://vente.club/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.vente.club/*"
  to = "https://vente.club/:splat"
  status = 301
  force = true

# Force all routes to index.html for client-side routing (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
  conditions = {path = "!^/(robots\\.txt|favicon-vente\\.png|logo\\.png|og-image\\.jpg|blog-.*\\.jpg|demo-photos/.*)$"}

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
